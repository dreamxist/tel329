# Broker de la Actividad 2. Escucha en IPv4 e IPv6 (sin bind address escucha
# en los dos; fd00::1 es la tun0 que crea tunslip6). Sin autenticacion: la red
# es una simulacion cerrada.
listener 1883
allow_anonymous true
# stderr y no stdout: stdout va con buffer cuando se redirige a archivo.
log_dest stderr
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
